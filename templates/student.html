<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Eligibility - SahayakAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="{{ url_for('index') }}"><span>Sahayak</span>AI</a></div>
        <div class="nav-links">
            <button id="lang-toggle" class="nav-btn">हिन्दी</button>
            <a href="{{ url_for('index') }}" class="nav-btn" data-en="Home" data-hi="होम">Home</a>
        </div>
    </nav>

    <div class="form-container">
        <h2 data-en="Student Eligibility Form" data-hi="छात्र पात्रता फॉर्म">Student Eligibility Form</h2>
        <form action="{{ url_for('check_eligibility', category='student') }}" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label data-en="Full Name" data-hi="पूरा नाम">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" pattern="[A-Za-z\s\.]+" title="Please enter in English only" required>
            </div>

            <div class="form-group">
                <label data-en="Age" data-hi="आयु">Age</label>
                <input type="number" id="age" name="age" class="form-control" required min="5" max="100">
            </div>

            <div class="form-group">
                <label data-en="State" data-hi="राज्य">State</label>
                <select name="state" id="state" class="form-control" required>
                    <option value="" disabled selected>Select State</option>
                    <option value="All">All India</option>
                    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chandigarh">Chandigarh</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Ladakh">Ladakh</option>
                    <option value="Lakshadweep">Lakshadweep</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Puducherry">Puducherry</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                </select>
            </div>

            <div class="form-group">
                <label data-en="Annual Family Income (₹)" data-hi="वार्षिक पारिवारिक आय (₹)">Annual Family Income (₹)</label>
                <input type="number" name="income" id="income" class="form-control" required>
            </div>

            <div class="form-group">
                <label data-en="Caste Category" data-hi="जाति श्रेणी">Caste Category</label>
                <select name="caste" class="form-control">
                    <option value="General" data-en="General" data-hi="सामान्य">General</option>
                    <option value="OBC" data-en="OBC" data-hi="ओबीसी">OBC</option>
                    <option value="SC" data-en="SC" data-hi="अनुसूचित जाति (SC)">SC</option>
                    <option value="ST" data-en="ST" data-hi="अनुसूचित जनजाति (ST)">ST</option>
                </select>
            </div>

            <div class="form-group">
                <label data-en="Person with Disability?" data-hi="क्या आप विकलांग हैं?">Person with Disability?</label>
                <select name="disability" class="form-control">
                    <option value="No" data-en="No" data-hi="नहीं">No</option>
                    <option value="Yes" data-en="Yes" data-hi="हाँ">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label data-en="Currently Enrolled in Education?" data-hi="क्या आप वर्तमान में शिक्षा प्राप्त कर रहे हैं?">Currently Enrolled in Education?</label>
                <select name="enrolled" class="form-control">
                    <option value="Yes" data-en="Yes" data-hi="हाँ">Yes</option>
                    <option value="No" data-en="No" data-hi="नहीं">No</option>
                </select>
            </div>

            <h3 data-en="Documents — AI Auto-Fill" data-hi="दस्तावेज़ — AI ऑटो-फ़िल">Documents — AI Auto-Fill</h3>

            <!-- AADHAAR UPLOAD WIDGET -->
            <div class="upload-widget" id="widget-aadhaar">
                <p class="upload-label"><span data-en="📄 Aadhaar Card" data-hi="📄 आधार कार्ड">📄 Aadhaar Card</span> <span style="color:#c62828;font-size:12px" data-en="(Required)" data-hi="(आवश्यक)">(Required)</span></p>
                <p class="upload-hint" data-en="AI will auto-fill your name, age & state" data-hi="AI आपका नाम, आयु और राज्य स्वत: भर देगा">AI will auto-fill your name, age &amp; state</p>
                <div class="upload-options">
                    <label class="upload-btn" for="doc-aadhaar-input" data-en="📁 Choose File" data-hi="📁 फ़ाइल चुनें">📁 Choose File</label>
                    <input type="file" id="doc-aadhaar-input" name="documents"
                           accept="image/*,.pdf" style="display:none">
                    <button type="button" class="upload-btn camera-btn open-camera-btn" data-en="📷 Take Photo" data-hi="📷 फोटो लें">📷 Take Photo</button>
                </div>
                <div class="camera-container" style="display:none">
                    <video class="camera-feed" autoplay playsinline></video>
                    <div class="camera-actions">
                        <button type="button" class="upload-btn capture-btn" data-en="📸 Capture" data-hi="📸 खींचें">📸 Capture</button>
                        <button type="button" class="upload-btn close-camera-btn"
                                style="background:#9e9e9e" data-en="✕ Close" data-hi="✕ बंद करें">✕ Close</button>
                    </div>
                    <canvas class="capture-canvas" style="display:none"></canvas>
                </div>
                <img class="doc-preview-img" alt="Aadhaar preview" style="display:none;">
                <p class="doc-preview-name"></p>
                <div id="banner-aadhaar"></div>
            </div>

            <!-- INCOME CERTIFICATE UPLOAD WIDGET -->
            <div class="upload-widget" id="widget-income">
                <p class="upload-label"><span data-en="📋 Income Certificate" data-hi="📋 आय प्रमाण पत्र">📋 Income Certificate</span> <span style="color:#c62828;font-size:12px" data-en="(Required)" data-hi="(आवश्यक)">(Required)</span></p>
                <p class="upload-hint" data-en="AI will auto-fill your annual income" data-hi="AI आपकी वार्षिक आय स्वत: भर देगा">AI will auto-fill your annual income</p>
                <div class="upload-options">
                    <label class="upload-btn" for="doc-income-input" data-en="📁 Choose File" data-hi="📁 फ़ाइल चुनें">📁 Choose File</label>
                    <input type="file" id="doc-income-input" name="documents"
                           accept="image/*,.pdf" style="display:none">
                </div>
                <img class="doc-preview-img" alt="Income certificate preview" style="display:none;">
                <p class="doc-preview-name"></p>
                <div id="banner-income"></div>
            </div>

            <!-- MARKSHEET UPLOAD WIDGET -->
            <div class="upload-widget" id="widget-marksheet">
                <p class="upload-label"><span data-en="📝 Marksheet" data-hi="📝 मार्कशीट">📝 Marksheet</span> <span style="color:#777;font-size:12px" data-en="(Optional)" data-hi="(वैकल्पिक)">(Optional)</span></p>
                <p class="upload-hint" data-en="Upload your latest marksheet" data-hi="अपनी नवीनतम मार्कशीट अपलोड करें">Upload your latest marksheet</p>
                <div class="upload-options">
                    <label class="upload-btn" for="doc-marksheet-input" data-en="📁 Choose File" data-hi="📁 फ़ाइल चुनें">📁 Choose File</label>
                    <input type="file" id="doc-marksheet-input" name="documents"
                           accept="image/*,.pdf" style="display:none">
                </div>
                <img class="doc-preview-img" alt="Marksheet preview" style="display:none;">
                <p class="doc-preview-name"></p>
                <div id="banner-marksheet"></div>
            </div>

            <button type="submit" class="btn-primary" data-en="Find Schemes" data-hi="योजनाएँ खोजें">Find Schemes</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
